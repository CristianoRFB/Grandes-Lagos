spring:
  application:
    name: gl-operations
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    session:
      timeout: ${identity.security.session-idle-timeout}
      cookie:
        http-only: true
        secure: true
        same-site: lax

identity:
  security:
    session-idle-timeout: ${IDENTITY_SESSION_IDLE_TIMEOUT:30m}
    sensitive-action-reauth: ${IDENTITY_SENSITIVE_ACTION_REAUTH:true}
