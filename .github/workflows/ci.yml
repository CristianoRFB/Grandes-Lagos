name: P00 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  p00:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11.19.0
        run: npm install --global npm@11.19.0

      - name: Verify toolchain
        run: |
          java -version
          ./backend/mvnw -version
          node --version
          npm --version
          docker compose version

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose
        run: docker compose --env-file infra/env/.env.example --file infra/compose.yml config

      - name: Build container images
        run: docker compose --env-file infra/env/.env.example --file infra/compose.yml build

      - name: Start P00 stack
        run: ./scripts/p00-up.sh

      - name: Verify P00 stack
        run: ./scripts/p00-verify.sh

      - name: Clean up P00 stack
        if: always()
        run: ./scripts/p00-down.sh
